        /* Cloud Animation Background */
        .cloud-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
        }

        .cloud:nth-child(1) {
            width: 300px;
            height: 100px;
            top: 10%;
            left: -100px;
            animation: floatCloud 25s linear infinite;
        }

        .cloud:nth-child(2) {
            width: 200px;
            height: 70px;
            top: 30%;
            right: -100px;
            animation: floatCloud 20s linear infinite 5s;
        }

        .cloud:nth-child(3) {
            width: 250px;
            height: 80px;
            bottom: 20%;
            left: -100px;
            animation: floatCloud 30s linear infinite 10s;
        }

        .cloud:nth-child(4) {
            width: 180px;
            height: 60px;
            bottom: 40%;
            right: -100px;
            animation: floatCloud 22s linear infinite 15s;
        }

        @keyframes floatCloud {
            0% {
                transform: translateX(0) translateY(0);
            }

            25% {
                transform: translateX(100px) translateY(-20px);
            }

            50% {
                transform: translateX(200px) translateY(0);
            }

            75% {
                transform: translateX(300px) translateY(20px);
            }

            100% {
                transform: translateX(400px) translateY(0);
            }
        }

        /* Rain Animation */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.3));
            animation: rainFall linear infinite;
        }

        @keyframes rainFall {
            0% {
                transform: translateY(-100px);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* Sun/Moon Animation */
        .sun-moon {
            position: fixed;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00);
            box-shadow: 0 0 60px #ffd700, 0 0 100px #ff8c00;
            top: 10%;
            right: 10%;
            z-index: -1;
            animation: sunMovement 30s ease-in-out infinite alternate;
        }

        @keyframes sunMovement {
            0% {
                transform: translateX(0) translateY(0);
                box-shadow: 0 0 60px #ffd700, 0 0 100px #ff8c00;
            }

            50% {
                transform: translateX(-50px) translateY(50px);
                box-shadow: 0 0 80px #ffd700, 0 0 120px #ff8c00;
            }

            100% {
                transform: translateX(-100px) translateY(0);
                background: radial-gradient(circle at 30% 30%, #f0f0f0, #888);
                box-shadow: 0 0 40px #f0f0f0, 0 0 80px #888;
            }

            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {

<body>
    <!-- Weather Animations -->
    <div class="cloud-container">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <div class="rain-container" id="rainContainer"></div>
    <div class="snow-container" id="snowContainer"></div>
    <div class="fog-container" id="fogContainer"></div>
    <div class="lightning" id="lightning"></div>

    <div class="sun-moon"></div>

    <!-- Weather Control Panel -->
    <div class="weather-control">
        <h3>Weather Effects</h3>
        <div class="weather-buttons">
            <button class="weather-btn active" data-weather="rain">
                <i class="fas fa-cloud-rain"></i> Rain
            </button>
            <button class="weather-btn" data-weather="snow">
                <i class="fas fa-snowflake"></i> Snow
            </button>
            <button class="weather-btn" data-weather="fog">
                <i class="fas fa-smog"></i> Fog
            </button>
            <button class="weather-btn" data-weather="storm">
                <i class="fas fa-bolt"></i> Storm
            </button>
            <button class="weather-btn" data-weather="clear">
                <i class="fas fa-sun"></i> Clear
            </button>
        </div>
    </div>

    <div class="container">
        <!-- Navigation -->
        <header>
            <nav>
                <div class="logo">
                    <a href="./index.html"><span>HU</span>SSEIN</a>
                </div>

                <div class="nav-center">
                    <div class="nav-links">
                        <a href="./#home">Home</a>
                        <a href="./#aboutme">About</a>
                        <a href="./#project">Projects</a>
                        <a href="./#services">Services</a>
                        <a href="./#skills">Skills</a>
                        <a href="./#contact">Contact</a>
                    </div>
                </div>

                <div class="nav-right">
                    <a href="Login Page.html" class="btn-login">Login</a>
                </div>

                <div class="mobile-menu">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </header>

        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Please login to your account</p>
                </div>

                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your valid email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Remember me
                        </label>
                        <a href="#" class="forgot-password" id="forgotPassword">Forgot password?</a>
                    </div>

                    <!-- Firebase message box -->
                    <div id="firebaseMessage" class="firebase-message" style="display:none; margin-bottom:12px;"></div>

                    <button type="submit" class="login-btn" id="loginButton">Login</button>

                    <div class="login-footer">
                        <!-- <p>Don't have an account? <a href="Sign In Page.html">Sign up here</a></p> -->
                        <p>Returning user? <a href="Login Page.html">Login here</a></p>
                        <a href="./index.html" class="back-home">← Back to Home</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Weather Effects System
        class WeatherSystem {
            constructor() {
                this.currentWeather = 'rain';
                this.containers = {
                    rain: document.getElementById('rainContainer'),
                    snow: document.getElementById('snowContainer'),
                    fog: document.getElementById('fogContainer'),
                    lightning: document.getElementById('lightning')
                };
                this.init();
            }

            init() {
                this.createRain();
                this.createSnow();
                this.createFog();
                this.setupWeatherControls();
            }

            createRain() {
                const container = this.containers.rain;
                for (let i = 0; i < 100; i++) {
                    const raindrop = document.createElement('div');
                    raindrop.classList.add('raindrop');

                    const left = Math.random() * 100;
                    const duration = 1 + Math.random() * 2;
                    const delay = Math.random() * 5;
                    const size = 10 + Math.random() * 20;

                    raindrop.style.left = `${left}%`;
                    raindrop.style.animationDuration = `${duration}s`;
                    raindrop.style.animationDelay = `${delay}s`;
                    raindrop.style.height = `${size}px`;

                    container.appendChild(raindrop);
                }
            }

            createSnow() {
                const container = this.containers.snow;
                for (let i = 0; i < 50; i++) {
                    const snowflake = document.createElement('div');
                    snowflake.classList.add('snowflake');

                    const left = Math.random() * 100;
                    const duration = 3 + Math.random() * 5;
                    const delay = Math.random() * 5;
                    const size = 3 + Math.random() * 6;

                    snowflake.style.left = `${left}%`;
                    snowflake.style.animationDuration = `${duration}s`;
                    snowflake.style.animationDelay = `${delay}s`;
                    snowflake.style.width = `${size}px`;
                    snowflake.style.height = `${size}px`;

                    container.appendChild(snowflake);
                }
            }

            createFog() {
                const container = this.containers.fog;
                for (let i = 0; i < 20; i++) {
                    const fog = document.createElement('div');
                    fog.classList.add('fog');

                    const top = Math.random() * 100;
                    const duration = 20 + Math.random() * 30;
                    const delay = Math.random() * 20;
                    const width = 100 + Math.random() * 200;
                    const height = 20 + Math.random() * 40;
                    const opacity = 0.1 + Math.random() * 0.2;

                    fog.style.top = `${top}%`;
                    fog.style.animationDuration = `${duration}s`;
                    fog.style.animationDelay = `${delay}s`;
                    fog.style.width = `${width}px`;
                    fog.style.height = `${height}px`;
                    fog.style.opacity = opacity;

                    container.appendChild(fog);
                }
            }

            createLightning() {
                const container = this.containers.lightning;
                const flash = document.createElement('div');
                flash.classList.add('lightning-flash');
                container.appendChild(flash);

                setTimeout(() => {
                    if (flash.parentNode === container) {
                        container.removeChild(flash);
                    }
                }, 200);
            }

            changeWeather(weatherType) {
                this.currentWeather = weatherType;

                // Hide all weather effects
                Object.values(this.containers).forEach(container => {
                    container.style.display = 'none';
                });

                // Show selected weather
                switch (weatherType) {
                    case 'rain':
                        this.containers.rain.style.display = 'block';
                        break;
                    case 'snow':
                        this.containers.snow.style.display = 'block';
                        break;
                    case 'fog':
                        this.containers.fog.style.display = 'block';
                        break;
                    case 'storm':
                        this.containers.rain.style.display = 'block';
                        // Start lightning storm
                        this.startLightningStorm();
                        break;
                    case 'clear':
                        // Show nothing (clear weather)
                        break;
                }

                // Update button states
                this.updateWeatherButtons(weatherType);
            }

            startLightningStorm() {
                // Create lightning at random intervals
                const createRandomLightning = () => {
                    if (this.currentWeather === 'storm') {
                        this.createLightning();
                        const nextLightning = 2000 + Math.random() * 8000;
                        setTimeout(createRandomLightning, nextLightning);
                    }
                };

                createRandomLightning();
            }

            updateWeatherButtons(activeWeather) {
                document.querySelectorAll('.weather-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.weather === activeWeather) {
                        btn.classList.add('active');
                    }
                });
            }

            setupWeatherControls() {
                document.querySelectorAll('.weather-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const weatherType = btn.dataset.weather;
                        this.changeWeather(weatherType);
                    });
                });
            }
        }

        // Initialize Weather System
        const weatherSystem = new WeatherSystem();

        // Mobile Menu Toggle
        const mobileMenu = document.querySelector('.mobile-menu');
        const navLinks = document.querySelector('.nav-links');
        const menuIcon = mobileMenu.querySelector('i');

        mobileMenu.addEventListener('click', function () {
            navLinks.classList.toggle('active');
            if (navLinks.classList.contains('active')) {
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-times');
            } else {
                menuIcon.classList.remove('fa-times');
                menuIcon.classList.add('fa-bars');
            }
        });

        // Close mobile menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', function () {
                navLinks.classList.remove('active');
                menuIcon.classList.remove('fa-times');
                menuIcon.classList.add('fa-bars');
            });
        });

        // Password Toggle Functionality
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        const eyeIcon = passwordToggle.querySelector('i');

        passwordToggle.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        // Form submission handling with validation and Firebase sign-in
        document.querySelector('.login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validation
            if (!fullname || !email || !password) {
                this.classList.add('shake');
                setTimeout(() => this.classList.remove('shake'), 500);
                alert('Please fill in all required fields.');
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }

            if (password.length < 6) {
                alert('Password should be at least 6 characters long.');
                return;
            }

            const submitBtn = document.getElementById('loginButton');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            submitBtn.disabled = true;

            try {
                // Ensure firebaseSignIn and firebaseAuth are available
                if (!window.firebaseSignIn || !window.firebaseAuth) {
                    throw new Error('Firebase not initialized');
                }

                const userCredential = await window.firebaseSignIn(window.firebaseAuth, email, password);
                const user = userCredential.user;

                // Save login data to database (optional, similar helper as other pages)
                try {
                    const userRef = window.firebaseRef(window.firebaseDatabase, 'users/' + user.uid);
                    const snapshot = await window.firebaseGet(userRef);
                    const now = new Date().toISOString();

                    if (snapshot && snapshot.exists && snapshot.exists()) {
                        const userData = snapshot.val();
                        const updates = { lastLogin: now, loginCount: (userData.loginCount || 0) + 1 };
                        await window.firebaseUpdate(userRef, updates);
                    } else {
                        const userData = { email: user.email, createdAt: now, lastLogin: now, loginCount: 1 };
                        await window.firebaseSet(userRef, userData);
                    }
                } catch (dbErr) {
                    console.warn('Could not save login data:', dbErr);
                }

                showFirebaseMessage('Welcome back, ' + (user.email || fullname) + '!', 'success');
                // Reset form and UI
                this.reset();
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
                passwordInput.type = 'password';

                // Redirect to homepage or dashboard
                window.location.href = './index.html';
            } catch (error) {
                console.error('Firebase sign-in error:', {
                    code: error?.code,
                    message: error?.message,
                    stack: error?.stack || null
                });

                // Friendly UI message with diagnostic hint
                let message = error?.message || 'Login failed.';
                if (error?.code === 'auth/invalid-credential') {
                    message = 'Invalid credential provided. Likely causes: incorrect API key/project config, disabled Email/Password provider, or restricted API key.';
                }

                // Show inline message and console guidance
                const friendly = mapFirebaseErrorToMessage(error);
                showFirebaseMessage(friendly + ` (${error?.code || 'unknown_error'})`, 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // Add shake animation for form validation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
            .shake {
                animation: shake 0.5s ease-in-out;
            }
        `;
        document.head.appendChild(style);

        // Helper to display messages in the inline firebaseMessage div
        function showFirebaseMessage(text, type) {
            const msg = document.getElementById('firebaseMessage');
            if (!msg) return;
            msg.textContent = text;
            msg.style.display = 'block';
            msg.classList.remove('error', 'success');
            if (type === 'error') msg.classList.add('error');
            if (type === 'success') msg.classList.add('success');
            // auto-hide success messages
            if (type === 'success') setTimeout(() => { msg.style.display = 'none'; }, 4000);
        }

        function mapFirebaseErrorToMessage(err) {
            if (!err || !err.code) return err?.message || 'Login failed.';
            switch (err.code) {
                case 'auth/invalid-email': return 'Invalid email address.';
                case 'auth/user-disabled': return 'This account has been disabled.';
                case 'auth/user-not-found': return 'No account found with this email.';
                case 'auth/wrong-password': return 'Incorrect password.';
                case 'auth/invalid-credential': return 'Invalid credential provided. Check project config and API key.';
                default: return err.message || 'Login failed.';
            }
        }

        // Add scroll effect to navbar
        window.addEventListener('scroll', function () {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.style.background = 'rgba(0, 0, 0, 0.3)';
                header.style.backdropFilter = 'blur(20px)';
            } else {
                header.style.background = 'rgba(255, 255, 255, 0.1)';
                header.style.backdropFilter = 'blur(10px)';
            }
        });

        // Add parallax effect to clouds
        window.addEventListener('scroll', function () {
            const scrolled = window.pageYOffset;
            const clouds = document.querySelectorAll('.cloud');

            clouds.forEach((cloud, index) => {
                const speed = 0.5 + (index * 0.1);
                const yPos = -(scrolled * speed);
                cloud.style.transform = `translateY(${yPos}px)`;
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', function (event) {
            if (!navLinks.contains(event.target) && !mobileMenu.contains(event.target)) {
                navLinks.classList.remove('active');
                menuIcon.classList.remove('fa-times');
                menuIcon.classList.add('fa-bars');
            }
        });

        // Forgot password handling
        const forgotLink = document.getElementById('forgotPassword');
        if (forgotLink) {
            forgotLink.addEventListener('click', async function (e) {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                if (!email) {
                    alert('Please enter your email in the email field first');
                    return;
                }
                try {
                    if (!window.firebaseSendPasswordResetEmail || !window.firebaseAuth) throw new Error('Firebase not initialized');
                    await window.firebaseSendPasswordResetEmail(window.firebaseAuth, email);
                    alert('Password reset email sent. Check your inbox.');
                } catch (err) {
                    console.error('Password reset error:', err);
                    alert('Failed to send reset email: ' + (err.message || err));
                }
            });
        }

        // Enter key to submit form
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && document.activeElement === passwordInput) {
                document.querySelector('.login-btn').click();
            }
        });

        // Auto-hide weather controls after inactivity
        let hideTimeout;
        function resetHideTimeout() {
            clearTimeout(hideTimeout);
            document.querySelector('.weather-control').style.opacity = '1';
            hideTimeout = setTimeout(() => {
                document.querySelector('.weather-control').style.opacity = '0.3';
            }, 3000);
        }

        document.querySelector('.weather-control').addEventListener('mouseenter', () => {
            clearTimeout(hideTimeout);
            document.querySelector('.weather-control').style.opacity = '1';
        });

        document.querySelector('.weather-control').addEventListener('mouseleave', resetHideTimeout);
        document.addEventListener('mousemove', resetHideTimeout);
        resetHideTimeout();
    </script>
</body>



</html>
