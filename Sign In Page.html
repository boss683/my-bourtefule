<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Login Page.css">
    <title>Sign Up - Hussein</title>
</head>
<body>
    <div class="signin-container">
        <div class="signin-card">
            <div class="signin-header">
                <h2>Create Account</h2>
                <p>Join us and start your journey</p>
            </div>

            <form class="signin-form" action="https://formsubmit.co/your@email.com" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Hussein Adam Hussein" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                </div>

                <div class="form-group">
                    <label class="terms">
                        <input type="checkbox" required>
                        I agree to the <a href="#">Terms and Conditions</a>
                    </label>
                </div>

                <button type="submit" class="signin-btn">Create Account</button>

                <div class="signin-footer">
                    <p>  have an account?  </p>   
                     <a href="Login Page.html">Login here</a>
                    <a href="prtefoly.html".html" class="back-home">← Back to Home</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
